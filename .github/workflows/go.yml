name: Go

on:
  push:
    branches: [main, go1.27-simd]
  pull_request:
    branches: [main, go1.27-simd]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.0-rc.2"

      - name: Set GOEXPERIMENT
        run: echo "GOEXPERIMENT=simd" >> $GITHUB_ENV

      - name: Verify Go version
        run: go version

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ matrix.os }}-go-1.27rc2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.os }}-go-1.27rc2-

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          if [ "$(uname -m)" = "x86_64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross llvm
          else
            sudo apt-get install -y llvm
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests (fallback path)
        env:
          HWY_NO_SIMD: "1"
        run: go test -v -race ./...

      - name: Run tests (SIMD enabled)
        run: go test -v -race ./...

      - name: Run tests (arm64 without GOEXPERIMENT, GoAT path)
        if: runner.arch == 'ARM64'
        env:
          GOEXPERIMENT: ""
        # hwy/contrib/varint excluded: pre-existing StreamVByte NEON kernel
        # bug on linux/arm64, tracked in #72 (fails on main + Go 1.26 too).
        run: go test -race $(go list ./... | grep -v hwy/contrib/varint)

      - name: EVEX guard (no AVX-512 ops in AVX2 functions)
        run: |
          out=$(go test -v -tags evexguard -run TestNoEVEXInAVX2ReachableFunctions ./internal/evexguard/ 2>&1)
          echo "$out"
          # Require positive confirmation that the guard actually ran and passed.
          # A skip (missing llvm-objdump / failed cross-build) or a -run that
          # matches nothing (tag or test-name drift -> "no tests to run") would
          # otherwise let the step go green while scanning nothing.
          if ! echo "$out" | grep -q -- '--- PASS: TestNoEVEXInAVX2ReachableFunctions'; then
            echo "::error::EVEX guard did not run to a PASS (skipped, or -run/build tag matched no test); it must execute in CI"
            exit 1
          fi

      - name: Debug ARM64 CPU features
        if: runner.arch == 'ARM64'
        run: |
          echo "=== /proc/cpuinfo features ==="
          grep -i features /proc/cpuinfo | head -1 || true
          echo ""
          echo "=== HWCAP flags ==="
          LD_SHOW_AUXV=1 /bin/true 2>&1 | grep -i hwcap || true
          echo ""
          echo "=== CPU model ==="
          grep -i "model name\|CPU implementer\|CPU part" /proc/cpuinfo | head -4 || true
          echo ""
          echo "=== Go runtime ARM64 features ==="
          go run -exec "" -v ./internal/cpuinfo || true

      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./hwy/contrib/...

      - name: Install wasmtime
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Test portable simd tier (wasm)
        run: |
          GOOS=wasip1 GOARCH=wasm go build ./hwy/... ./hwy/contrib/vec/
          GOOS=wasip1 GOARCH=wasm go test -exec "$(go env GOROOT)/lib/wasm/go_wasip1_wasm_exec" -count=1 ./hwy/contrib/vec/

      - name: Build hwygen
        run: go build -o bin/hwygen ./cmd/hwygen

      - name: Regenerate contrib packages
        if: runner.arch == 'ARM64'
        run: |
          export PATH=$PWD/bin:$PATH
          go generate ./hwy/contrib/...
          go build ./hwy/contrib/...

      - name: Generate examples
        run: |
          export PATH=$PWD/bin:$PATH
          cd examples/softmax && go generate ./...
          cd ../gelu && go generate ./...

      - name: Build examples
        run: |
          go build -o examples/basic/basic ./examples/basic
          go build -o examples/contrib_test/contrib_test ./examples/contrib_test
          go build -o examples/softmax/softmax_test ./examples/softmax
          go build -o examples/gelu/gelu_test ./examples/gelu

      - name: Run basic example
        run: ./examples/basic/basic

      - name: Run contrib_test example
        run: ./examples/contrib_test/contrib_test

      - name: Test softmax example
        run: go test -v ./examples/softmax/...

      - name: Test gelu example
        run: go test -v ./examples/gelu/...
